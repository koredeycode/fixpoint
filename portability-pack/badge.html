<!-- One-line embeddable badge: paste onto any page. Replace the URL with your site's network URL (the folder holding agent-manifest.json, then the network name). data-ns-network is the machine-readable pointer; the class and text are yours to style. -->
<a
  class="ns-network-badge"
  data-ns-network="https://your-site.example/your_network"
  href="https://your-site.example/your_network"
  target="_blank"
  rel="noopener"
  aria-label="Chat with this site's agent network"
  >Ask this site's agents</a
>
